<script>
document.addEventListener('DOMContentLoaded', () => {
    const statusEl = document.getElementById('status');
    const resultBox = document.getElementById('result-container');

    const urlParams = new URLSearchParams(window.location.search);

    const requestData = {
        device_type: urlParams.get('device_type') || 'Desktop',
        specific_cpu: urlParams.get('specific_cpu') || urlParams.get('cpu') || 'Intel Core i3',
        ram_spec: urlParams.get('ram_spec') || urlParams.get('ram') || '8 GB',
        storage_type: urlParams.get('storage_type') || urlParams.get('storage') || 'SATA SSD',
        gpu_category: urlParams.get('gpu_category') || urlParams.get('gpu') || 'Integrated GPU',
        category: urlParams.get('category') || 'Gaming'
    };

    fetch('/analyze', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json'
        },
        body: JSON.stringify(requestData)
    })
    .then(async response => {
        const data = await response.json();
        if (!response.ok) {
            throw new Error(data.error || 'Server error ' + response.status);
        }
        return data;
    })
    .then(data => {
        statusEl.style.display = 'none';
        resultBox.style.display = 'block';

        if (data.recommendations) {
            resultBox.innerText = data.recommendations;
        } else if (data.error) {
            resultBox.innerText = "Error: " + data.error;
            resultBox.style.color = "#f87171";
        }
    })
    .catch(error => {
        console.error('Fetch error:', error);
        statusEl.style.display = 'none';
        resultBox.style.display = 'block';
        resultBox.innerText = "Error: " + error.message;
        resultBox.style.color = "#f87171";
    });
});
</script>
