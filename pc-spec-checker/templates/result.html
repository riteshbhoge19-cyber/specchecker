<script>
  document.addEventListener('DOMContentLoaded', () => {
    const urlParams = new URLSearchParams(window.location.search);

    const requestData = {
      device_type: urlParams.get('device_type') || 'Desktop',
      specific_cpu: urlParams.get('specific_cpu') || '',
      ram_spec: urlParams.get('ram_spec') || '',
      storage_type: urlParams.get('storage_type') || '',
      gpu_category: urlParams.get('gpu_category') || '',
      category: 'Gaming'
    };

    const displayElement = document.getElementById('recommendations-container') || 
                           document.querySelector('.recommendations') || 
                           document.body;

    fetch('/analyze', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify(requestData)
    })
    .then(response => {
      if (!response.ok) {
        throw new Error('Server returned ' + response.status);
      }
      return response.json();
    })
    .then(data => {
      if (data.recommendations) {
        displayElement.innerText = data.recommendations;
      } else if (data.error) {
        displayElement.innerText = 'Error: ' + data.error;
      }
    })
    .catch(error => {
      console.error('Fetch Error:', error);
      displayElement.innerText = 'Failed to connect to API.';
    });
  });
</script>
